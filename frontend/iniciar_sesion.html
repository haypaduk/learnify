<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnify | Iniciar Sesión</title>
    <link rel="stylesheet" href="css/base.css">
</head>
<body>
    <div class="contenedor">
        <h2>Iniciar Sesión</h2>

        <!-- Mensajes de éxito/error -->
        <div id="mensaje" class="mensaje"></div>

        <!-- Formulario de login -->
        <form id="formulario-login">
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>

            <button type="submit" class="btn primario btn-block">Entrar</button>
        </form>

        <!-- Enlaces -->
        <div class="enlace-rapido">
            ¿No tienes cuenta? <a href="registrarse.html">Regístrate</a>
        </div>
        <div class="volver">
            <a href="bienvenida.html">← Volver al inicio</a>
        </div>
    </div>

    <script src="js/autenticacion.js"></script>
</body>
</html>
