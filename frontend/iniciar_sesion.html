<!DOCTYPE html> <!-- Indica el lenguaje a HTML5 ultima version en los navegadores.-->
<html lang="es"> <!--lang = "es" = pagina en español.-->
<head> <!-- Son configuraciones q no saldran en la pagina, es como tener algo dentro de datos sin q se vean de configuraciones. -->
    <meta charset="UTF-8"> <!-- Para usar ñ y tildes. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Para moviles-->
    <title> Learnify | Iniciar Sesión </title> <!-- Titulo de la pestaña. -->

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/animaciones_login_registro.css"> <!-- Estilos de animación -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Iconos Font Awesome -->
</head>

<body> <!-- Todo lo q se coloque dentro, se mostrara en el navegador o pagina. -->
    <div class="contenedor"> <!-- "división", es como una caja que agrupa contenido
         class="contenedor" = le aplicamos la clase "contenedor" del CSS
         Esta clase del CSS hace que la caja tenga:
         - Fondo blanco
         - Bordes redondeados
         - Sombra
         - Ancho máximo de 400px-->

        <h2><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</h2> <!-- Encabezado nivel 2 -->

        <div id="mensaje" class="mensaje"></div> <!-- Mensajes de éxito/error -->

        <form id="formulario-login"> <!-- Formulario de login -->

            <!-- Campo de correo con icono -->
            <div class="campo-animado input-icon">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Correo electrónico" required>
            </div>

            <!-- Campo de contraseña con icono -->
            <div class="campo-animado input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>

            <button type="submit" class="btn primario btn-block">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>

        <div class="enlace-rapido">
            ¿No tienes cuenta? <a href="registrarse.html">Regístrate</a>
        </div>

        <div class="volver">
            <a href="bienvenida.html"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
        </div>
    </div>

    <script src="js/autenticacion.js"></script>
</body>
</html>
