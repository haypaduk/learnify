<!-- ============================================
     ARCHIVO 27/30: DETALLE DE TAREA
     Muestra información completa de una tarea
     ============================================ -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnify | Detalle de Tarea</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/detalle-tarea.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="menu-lateral">
    <div class="app-container">
        <!-- ============================================ -->
        <!-- MENÚ LATERAL                                 -->
        <!-- ============================================ -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-graduation-cap"></i><span> Learnify</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="../dashboard.html" class="menu-item">
                    <i class="fas fa-chart-line"></i><span> Dashboard</span>
                </a>
                <a href="../pages/mis_equipos.html" class="menu-item">
                    <i class="fas fa-users"></i><span> Mis Equipos</span>
                </a>
                <a href="#" class="menu-item" id="menuCrearEquipo" style="display: none;">
                    <i class="fas fa-plus-circle"></i><span> Crear Equipo</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info-sidebar" id="userInfoSidebar"></div>
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i><span> Cerrar sesión</span>
                </button>
            </div>
        </aside>

        <!-- ============================================ -->
        <!-- CONTENIDO PRINCIPAL                          -->
        <!-- ============================================ -->
        <main class="main-content">
            <div class="contenedor contenedor-grande">
                <!-- Contenido principal -->
                <div id="tareaContent">
                    <div class="sin-entregas">
                        <i class="fas fa-spinner fa-pulse"></i> Cargando información de la tarea...
                    </div>
                </div>
            </div>

            <!-- Modal para ver entrega -->
            <div id="modalVerEntrega" class="modal" style="display: none;">
                <div class="modal-contenido">
                    <div class="modal-header">
                        <h3><i class="fas fa-file-alt"></i> Detalle de entrega</h3>
                        <button class="modal-cerrar" onclick="cerrarModalEntrega()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div id="modalEntregaContent"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS                                       -->
    <!-- ============================================ -->
    <script src="../js/menu.js"></script>
    <script src="../js/detalle-tarea.js"></script>
</body>
</html>
