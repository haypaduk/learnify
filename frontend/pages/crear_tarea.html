<!-- ============================================
     ARCHIVO 23/30: CREAR TAREA
     Formulario para crear una nueva tarea en un equipo
     ============================================ -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnify | Crear Tarea</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/crear-tarea.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="contenedor">
        <h2><i class="fas fa-tasks"></i> Crear Nueva Tarea</h2>

        <!-- Mensajes -->
        <div id="mensaje" class="mensaje"></div>

        <!-- Formulario -->
        <form id="formCrearTarea" class="form-tarea">
            <div class="form-grupo">
                <label for="titulo"><i class="fas fa-heading"></i> Título de la tarea *</label>
                <input type="text" id="titulo" placeholder="Ej: Reporte semanal, Examen parcial, etc." required>
                <div class="ayuda"><i class="fas fa-lightbulb"></i> Elige un título claro para la tarea.</div>
            </div>

            <div class="form-grupo">
                <label for="descripcion"><i class="fas fa-align-left"></i> Descripción (opcional)</label>
                <textarea id="descripcion" placeholder="Describe qué deben hacer los alumnos, instrucciones, etc."></textarea>
                <div class="ayuda"><i class="fas fa-info-circle"></i> Explica claramente lo que se espera.</div>
            </div>

            <div class="form-grupo">
                <label for="fecha_limite"><i class="fas fa-calendar-alt"></i> Fecha límite (opcional)</label>
                <input type="date" id="fecha_limite">
                <div class="ayuda"><i class="fas fa-hourglass-end"></i> Fecha máxima para entregar la tarea.</div>
            </div>

            <div class="botones-form">
                <button type="button" class="btn secundario btn-cancelar" onclick="cancelar()">
                    <i class="fas fa-times"></i> Cancelar
                </button>
                <button type="submit" class="btn primario">
                    <i class="fas fa-save"></i> Crear tarea
                </button>
            </div>
        </form>

        <div class="volver" style="margin-top: 1.5rem;">
            <a href="#" id="volverLink"><i class="fas fa-arrow-left"></i> Volver a tareas</a>
        </div>
    </div>

    <script src="../js/crear-tarea.js"></script>
</body>
</html>
