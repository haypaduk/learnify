<!-- ============================================
     ARCHIVO: crear_estadia.html
     Formulario para solicitar/editar una estadía profesional
     ============================================ -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnify | Solicitar Estadía</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/menu.css">
    <link rel="stylesheet" href="../../css/estadias.css">
    <link rel="stylesheet" href="../../css/temas_oscuro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="menu-lateral">
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-graduation-cap"></i><span> Learnify</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="../../dashboard.html" class="menu-item">
                    <i class="fas fa-chart-line"></i><span> Dashboard</span>
                </a>
                <a href="../mis_equipos.html" class="menu-item">
                    <i class="fas fa-users"></i><span> Mis Equipos</span>
                </a>
                <a href="../analisis/analisis_alumnos.html" class="menu-item">
                    <i class="fas fa-chart-pie"></i><span> Análisis</span>
                </a>
                <a href="../duales/mis_duales.html" class="menu-item">
                    <i class="fas fa-briefcase"></i><span> Duales</span>
                </a>
                <a href="mis_estadias.html" class="menu-item">
                    <i class="fas fa-building"></i><span> Estadías</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info-sidebar" id="userInfoSidebar"></div>
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i><span> Cerrar sesión</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="estadias-container">
                <div class="header-estadias">
                    <h2><i class="fas fa-plus-circle"></i> Solicitar Estadía</h2>
                </div>

                <div id="mensaje" class="mensaje"></div>

                <form id="formCrearEstadia" class="form-estadia">
                    <div class="form-grupo">
                        <label for="titulo"><i class="fas fa-tag"></i> Título / Proyecto *</label>
                        <input type="text" id="titulo" placeholder="Ej: Desarrollo Web, Implementación ERP" required>
                    </div>

                    <div class="form-grupo">
                        <label for="empresa"><i class="fas fa-building"></i> Empresa / Institución *</label>
                        <input type="text" id="empresa" placeholder="Nombre de la empresa" required>
                    </div>

                    <div class="form-grupo">
                        <label for="descripcion"><i class="fas fa-align-left"></i> Descripción del proyecto</label>
                        <textarea id="descripcion" rows="4" placeholder="Describe las actividades y objetivos de la estadía..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-grupo">
                            <label for="fecha_inicio"><i class="fas fa-calendar-alt"></i> Fecha de inicio</label>
                            <input type="date" id="fecha_inicio">
                        </div>
                        <div class="form-grupo">
                            <label for="fecha_fin"><i class="fas fa-calendar-check"></i> Fecha de término</label>
                            <input type="date" id="fecha_fin">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-grupo">
                            <label for="horas"><i class="fas fa-clock"></i> Horas totales</label>
                            <input type="number" id="horas" placeholder="Ej: 600" min="0">
                        </div>
                        <div class="form-grupo">
                            <label for="ubicacion"><i class="fas fa-map-marker-alt"></i> Ubicación</label>
                            <input type="text" id="ubicacion" placeholder="Ciudad, Estado">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-grupo">
                            <label for="tutor"><i class="fas fa-chalkboard-user"></i> Tutor en la empresa</label>
                            <input type="text" id="tutor" placeholder="Nombre del tutor">
                        </div>
                        <div class="form-grupo">
                            <label for="estado"><i class="fas fa-flag-checkered"></i> Estado</label>
                            <select id="estado">
                                <option value="pendiente">Pendiente de aprobación</option>
                                <option value="en-curso">En curso</option>
                                <option value="completada">Completada</option>
                                <option value="cancelada">Cancelada</option>
                            </select>
                        </div>
                    </div>

                    <div class="botones-form">
                        <button type="button" class="btn secundario" onclick="cancelar()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button type="submit" class="btn primario">
                            <i class="fas fa-save"></i> Guardar Estadía
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../../js/menu.js"></script>
    <script>
        // ============================================
        // OBTENER USUARIO DEL LOCALSTORAGE
        // ============================================
        const usuario = JSON.parse(localStorage.getItem('usuario'));
        
        if (!usuario) {
            window.location.href = '../../iniciar_sesion.html';
        }
        
        // ============================================
        // DETECTAR SI ES EDICIÓN
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const estadiaId = urlParams.get('id');
        
        let modoEdicion = false;
        
        if (estadiaId) {
            modoEdicion = true;
            document.querySelector('h2').innerHTML = '<i class="fas fa-edit"></i> Editar Estadía';
            cargarDatosEstadia(estadiaId);
        }
        
        // ============================================
        // CARGAR DATOS DE LA ESTADÍA PARA EDITAR
        // ============================================
        async function cargarDatosEstadia(id) {
            try {
                const respuesta = await fetch(`/api/estadias/detalle/${id}`);
                const resultado = await respuesta.json();
                
                if (resultado.exito) {
                    const estadia = resultado.estadia;
                    document.getElementById('titulo').value = estadia.titulo || '';
                    document.getElementById('empresa').value = estadia.empresa || '';
                    document.getElementById('descripcion').value = estadia.descripcion || '';
                    document.getElementById('fecha_inicio').value = estadia.fecha_inicio || '';
                    document.getElementById('fecha_fin').value = estadia.fecha_fin || '';
                    document.getElementById('horas').value = estadia.horas || '';
                    document.getElementById('ubicacion').value = estadia.ubicacion || '';
                    document.getElementById('tutor').value = estadia.tutor || '';
                    document.getElementById('estado').value = estadia.estado || 'pendiente';
                }
            } catch (error) {
                console.error('Error al cargar datos:', error);
            }
        }
        
        // ============================================
        // CANCELAR
        // ============================================
        function cancelar() {
            window.location.href = 'mis_estadias.html';
        }
        
        // ============================================
        // ENVIAR FORMULARIO (CREAR O ACTUALIZAR)
        // ============================================
        document.getElementById('formCrearEstadia').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const mensajeDiv = document.getElementById('mensaje');
            
            const datos = {
                usuario_id: usuario._id,
                titulo: document.getElementById('titulo').value,
                empresa: document.getElementById('empresa').value,
                descripcion: document.getElementById('descripcion').value,
                fecha_inicio: document.getElementById('fecha_inicio').value,
                fecha_fin: document.getElementById('fecha_fin').value,
                horas: document.getElementById('horas').value,
                ubicacion: document.getElementById('ubicacion').value,
                tutor: document.getElementById('tutor').value,
                estado: document.getElementById('estado').value
            };
            
            const url = modoEdicion ? `/api/estadias/actualizar/${estadiaId}` : '/api/estadias/crear';
            const metodo = modoEdicion ? 'PUT' : 'POST';
            
            mensajeDiv.className = 'mensaje';
            mensajeDiv.textContent = 'Guardando...';
            mensajeDiv.style.display = 'block';
            
            try {
                const respuesta = await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                
                const resultado = await respuesta.json();
                
            if (resultado.exito) {
                mensajeDiv.className = 'mensaje exito';
                mensajeDiv.innerHTML = '<i class="fas fa-check-circle"></i> ' + (modoEdicion ? 'Estadía actualizada correctamente' : 'Solicitud enviada correctamente');
                setTimeout(() => {
                    window.location.href = 'mis_estadias.html';
                }, 1500);
            } else {
                mensajeDiv.className = 'mensaje error';
                mensajeDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ' + resultado.mensaje;
            }
            } catch (error) {
                console.error('Error:', error);
                mensajeDiv.className = 'mensaje error';
                mensajeDiv.innerHTML = '<i class="fas fa-wifi"></i> Error de conexión';
            }
        });
    </script>
</body>
</html>
