<!-- ============================================
     ARCHIVO: crear_dual.html
     Formulario para registrar/editar un dual
     ============================================ -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnify | Registrar Dual</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/menu.css">
    <link rel="stylesheet" href="../../css/duales.css">
    <link rel="stylesheet" href="../../css/temas_oscuro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="menu-lateral">
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-graduation-cap"></i><span> Learnify</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="../../dashboard.html" class="menu-item">
                    <i class="fas fa-chart-line"></i><span> Dashboard</span>
                </a>
                <a href="../mis_equipos.html" class="menu-item">
                    <i class="fas fa-users"></i><span> Mis Equipos</span>
                </a>
                <a href="../analisis/analisis_alumnos.html" class="menu-item">
                    <i class="fas fa-chart-pie"></i><span> Análisis</span>
                </a>
                <a href="mis_duales.html" class="menu-item">
                    <i class="fas fa-briefcase"></i><span> Duales</span>
                </a>
                <a href="../estadias/mis_estadias.html" class="menu-item">
                    <i class="fas fa-building"></i><span> Estadías</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info-sidebar" id="userInfoSidebar"></div>
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i><span> Cerrar sesión</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="duales-container">
                <div class="header-duales">
                    <h2><i class="fas fa-plus-circle"></i> Registrar Dual</h2>
                </div>

                <div id="mensaje" class="mensaje"></div>

                <form id="formCrearDual" class="form-dual">
                    <div class="form-grupo">
                        <label for="titulo"><i class="fas fa-tag"></i> Título del Dual *</label>
                        <input type="text" id="titulo" placeholder="Ej: Desarrollo Frontend, Analista de Datos" required>
                    </div>

                    <div class="form-grupo">
                        <label for="empresa"><i class="fas fa-building"></i> Empresa *</label>
                        <input type="text" id="empresa" placeholder="Nombre de la empresa" required>
                    </div>

                    <div class="form-grupo">
                        <label for="descripcion"><i class="fas fa-align-left"></i> Descripción</label>
                        <textarea id="descripcion" rows="3" placeholder="Describe las actividades a realizar..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-grupo">
                            <label for="fecha_inicio"><i class="fas fa-calendar-alt"></i> Fecha de inicio</label>
                            <input type="date" id="fecha_inicio">
                        </div>
                        <div class="form-grupo">
                            <label for="fecha_fin"><i class="fas fa-calendar-check"></i> Fecha de término</label>
                            <input type="date" id="fecha_fin">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-grupo">
                            <label for="horas"><i class="fas fa-clock"></i> Horas totales</label>
                            <input type="number" id="horas" placeholder="Ej: 480" min="0">
                        </div>
                        <div class="form-grupo">
                            <label for="tutor"><i class="fas fa-chalkboard-user"></i> Tutor</label>
                            <input type="text" id="tutor" placeholder="Nombre del tutor">
                        </div>
                    </div>

                    <div class="form-grupo">
                        <label for="estado"><i class="fas fa-flag-checkered"></i> Estado</label>
                        <select id="estado">
                            <option value="pendiente">Pendiente</option>
                            <option value="activo">Activo</option>
                            <option value="finalizado">Finalizado</option>
                        </select>
                    </div>

                    <div class="botones-form">
                        <button type="button" class="btn secundario" onclick="cancelar()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button type="submit" class="btn primario">
                            <i class="fas fa-save"></i> Guardar Dual
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../../js/menu.js"></script>
    <script>
        // ============================================
        // OBTENER USUARIO DEL LOCALSTORAGE
        // ============================================
        const usuario = JSON.parse(localStorage.getItem('usuario'));
        
        if (!usuario) {
            window.location.href = '../../iniciar_sesion.html';
        }
        
        // ============================================
        // DETECTAR SI ES EDICIÓN
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const dualId = urlParams.get('id');
        
        let modoEdicion = false;
        
        if (dualId) {
            modoEdicion = true;
            document.querySelector('h2').innerHTML = '<i class="fas fa-edit"></i> Editar Dual';
            cargarDatosDual(dualId);
        }
        
        // ============================================
        // CARGAR DATOS DEL DUAL PARA EDITAR
        // ============================================
        async function cargarDatosDual(id) {
            try {
                const respuesta = await fetch(`/api/duales/detalle/${id}`);
                const resultado = await respuesta.json();
                
                if (resultado.exito) {
                    const dual = resultado.dual;
                    document.getElementById('titulo').value = dual.titulo || '';
                    document.getElementById('empresa').value = dual.empresa || '';
                    document.getElementById('descripcion').value = dual.descripcion || '';
                    document.getElementById('fecha_inicio').value = dual.fecha_inicio || '';
                    document.getElementById('fecha_fin').value = dual.fecha_fin || '';
                    document.getElementById('horas').value = dual.horas || '';
                    document.getElementById('tutor').value = dual.tutor || '';
                    document.getElementById('estado').value = dual.estado || 'pendiente';
                }
            } catch (error) {
                console.error('Error al cargar datos:', error);
            }
        }
        
        // ============================================
        // CANCELAR
        // ============================================
        function cancelar() {
            window.location.href = 'mis_duales.html';
        }
        
        // ============================================
        // ENVIAR FORMULARIO (CREAR O ACTUALIZAR)
        // ============================================
        document.getElementById('formCrearDual').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const mensajeDiv = document.getElementById('mensaje');
            
            const datos = {
                usuario_id: usuario._id,
                titulo: document.getElementById('titulo').value,
                empresa: document.getElementById('empresa').value,
                descripcion: document.getElementById('descripcion').value,
                fecha_inicio: document.getElementById('fecha_inicio').value,
                fecha_fin: document.getElementById('fecha_fin').value,
                horas: document.getElementById('horas').value,
                tutor: document.getElementById('tutor').value,
                estado: document.getElementById('estado').value
            };
            
            const url = modoEdicion ? `/api/duales/actualizar/${dualId}` : '/api/duales/crear';
            const metodo = modoEdicion ? 'PUT' : 'POST';
            
            mensajeDiv.className = 'mensaje';
            mensajeDiv.textContent = 'Guardando...';
            mensajeDiv.style.display = 'block';
            
            try {
                const respuesta = await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                
                const resultado = await respuesta.json();
                
            if (resultado.exito) {
                mensajeDiv.className = 'mensaje exito';
                mensajeDiv.innerHTML = '<i class="fas fa-check-circle"></i> ' + (modoEdicion ? 'Dual actualizado correctamente' : 'Dual registrado correctamente');
                setTimeout(() => {
                    window.location.href = 'mis_duales.html';
                }, 1500);
            } else {
                mensajeDiv.className = 'mensaje error';
                mensajeDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ' + resultado.mensaje;
            }
            } catch (error) {
                console.error('Error:', error);
                mensajeDiv.className = 'mensaje error';
                mensajeDiv.innerHTML = '<i class="fas fa-wifi"></i> Error de conexión';
            }        
        });
    </script>
</body>
</html>
