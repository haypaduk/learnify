<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnify | Dashboard</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="menu-lateral">
    <div class="app-container">
        <!-- Menú lateral (estructura HTML) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-graduation-cap"></i><span> Learnify</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="menu-item active">
                    <i class="fas fa-chart-line"></i><span> Dashboard</span>
                </a>
                <a href="pages/mis_equipos.html" class="menu-item">
                    <i class="fas fa-users"></i><span> Mis Equipos</span>
                </a>
                <a href="#" class="menu-item" id="menuCrearEquipo" style="display: none;">
                    <i class="fas fa-plus-circle"></i><span> Crear Equipo</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info-sidebar" id="userInfoSidebar"></div>
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i><span> Cerrar sesión</span>
                </button>
            </div>
        </aside>

        <!-- Contenido principal -->
        <main class="main-content">
            <!-- TODO el contenido original del dashboard -->
            <div class="dashboard-container">
                <div class="dashboard-header">
                    <h1>📚 Learnify Classroom</h1>
                    <p>Bienvenido/a, <strong id="usuarioNombre">Cargando...</strong></p>
                    <div class="user-badge" id="usuarioRol"></div>
                </div>

                <div class="dashboard-grid">
                    <div class="card">
                        <h3>📁 Mis Equipos</h3>
                        <div id="equiposLista">Cargando equipos...</div>
                        <div class="acciones">
                            <a href="pages/mis_equipos.html" class="btn-accion">Ver todos</a>
                        </div>
                    </div>

                    <div class="card">
                        <h3>📋 Tareas Pendientes</h3>
                        <div id="tareasPendientesLista">Cargando tareas...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript separado -->
    <script src="js/menu.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
